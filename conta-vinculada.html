<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conta Vinculada — Retenção Mensal</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:12px;background:#e8e8e8;color:#000}
.page{background:#fff;width:1280px;max-width:98vw;margin:10px auto;padding:16px 20px;box-shadow:0 0 10px rgba(0,0,0,.35)}
.cab{border-bottom:2px solid #047857;padding-bottom:10px;margin-bottom:12px}
.cab h1{font-size:15px;color:#047857;letter-spacing:.5px}
.cab h2{font-size:12px;font-weight:normal;color:#555;margin-top:2px}
.ident{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px;font-size:12px}
.ident div span{color:#777;text-transform:uppercase;font-size:10px;letter-spacing:.5px;display:block}
.ident div b{font-size:13px;color:#047857}
.aviso{background:#fff8e1;border:1px solid #ffe08a;border-left:4px solid #f0ad00;border-radius:3px;padding:9px 12px;margin-bottom:12px;font-size:11.5px;line-height:1.5}
.tituloform{text-align:center;font-size:26px;font-weight:bold;color:#047857;letter-spacing:.5px;margin:6px 0 14px}
.tabbar{display:flex;gap:3px;overflow-x:auto;padding:6px;background:#047857;border-radius:4px;margin-bottom:10px}
.tab-btn{flex:0 0 auto;min-width:78px;padding:5px 10px;font-size:10px;border:1px solid #10b981;background:#10b981;color:#fff;border-radius:3px;cursor:pointer;white-space:nowrap;font-family:Arial;text-align:center;line-height:1.3}
.tab-btn.active{background:#fff;color:#047857;font-weight:bold;border-color:#fff}
.tab-btn b{display:block;font-size:11px}
.tab-btn small{font-size:9.5px;opacity:.95}
.tab-btn:hover{opacity:.92}
/* A tabela mantém a largura natural das colunas; se não couber na página,
   rola na horizontal em vez de espremer e cortar o conteúdo das células. */
#tabela{overflow-x:auto}
table{width:100%;border-collapse:collapse}
#tabela>table{min-width:1800px}
th{background:#047857;color:#fff;font-size:10px;padding:6px 4px;text-align:center;font-weight:bold;border:1px solid #064e3b}
th.g1{background:#10b981}
td{border:1px solid #c9c9c9;padding:2px;text-align:center;font-size:11px}
tr:nth-child(even) td{background:#f0fdf4}
td input,td select{width:100%;border:1px solid transparent;background:transparent;font-family:Arial;font-size:11px;padding:4px 3px;text-align:center;border-radius:2px}
td input:focus,td select:focus{outline:none;border-color:#10b981;background:#fff}
td.calc{background:#ecfdf5;font-weight:bold;color:#047857;white-space:nowrap}
tr:nth-child(even) td.calc{background:#d1fae5}
.rm{border:1px solid #d9534f;background:#fff;color:#d9534f;border-radius:3px;cursor:pointer;font-size:12px;line-height:1;padding:3px 7px}
.rm:hover{background:#d9534f;color:#fff}
tfoot td{background:#047857;color:#fff;font-weight:bold;border-color:#064e3b;white-space:nowrap}
.barra{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
.btn{border:none;border-radius:3px;padding:7px 14px;font-size:11.5px;font-weight:bold;cursor:pointer;font-family:Arial}
.btn-add{background:#10b981;color:#fff}
.btn-salvar{background:#1e7e34;color:#fff}
.btn-print{background:#6c757d;color:#fff}
.btn-copiar{background:#0d9488;color:#fff}
.btn-excel{background:#217346;color:#fff}
.btn-import{background:#2563eb;color:#fff}
.btn:hover{opacity:.88}
/* Coluna Nome: acompanha o tamanho do texto digitado */
td input.col-nome{width:auto;min-width:150px;max-width:340px;text-align:left}
.status{font-size:11.5px;margin-left:auto;color:#555}
.status.ok{color:#1e7e34;font-weight:bold}
.status.erro{color:#d9534f;font-weight:bold}
.resumo{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:2px solid #047857}
.resumo div{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:4px;padding:8px 14px;min-width:150px}
.resumo span{display:block;font-size:10px;color:#777;text-transform:uppercase;letter-spacing:.5px}
.resumo b{font-size:14px;color:#047857}
.resumo .total-dest span{font-weight:bold;color:#047857}
.resumo .total-dest b{font-size:18px;font-weight:bold}
.vazio{text-align:center;padding:26px;color:#888;font-style:italic}
.carregando{text-align:center;padding:60px;color:#047857;font-size:14px}
@page{size:A4 landscape;margin:8mm}
@media print{
  body{background:#fff}
  .page{width:auto;box-shadow:none;margin:0;padding:0}
  .tabbar,.barra,.rm,.aviso{display:none!important}
  /* No papel não há rolagem: a tabela volta a caber na página (A4 paisagem).
     Compacta fonte/espaçamento e libera as larguras fixas para que todas as
     colunas caibam na largura útil da folha sem cortar nada. */
  #tabela{overflow:visible}
  #tabela>table{min-width:0;table-layout:auto}
  #tabela th,#tabela td{width:auto!important;padding:1px 2px;font-size:8px}
  #tabela input,#tabela select{font-size:8px;padding:1px 2px}
  td input.col-nome{min-width:0!important;max-width:none!important;width:auto!important}
  td input,td select{border:none}
  /* Na impressão, ocultar as parcelas calculadas (13º, Férias, Rescisão, Submódulo 4.1)
     e a coluna de remover; mantém "Total depositado". */
  .cvc-n,.cvc-o,.cvc-p,.cvc-q,.cvc-x{display:none!important}
  /* No PDF não sai a coluna "Contratado pela empresa" */
  .cvcol-contratado{display:none!important}
}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="carregando" id="carregando">Abrindo o formulário…</div>
  <div id="conteudo" style="display:none">
    <div class="cab">
      <h1>UNIVERSIDADE FEDERAL DO RIO DE JANEIRO</h1>
      <h2>Pró-Reitoria de Gestão e Governança &middot; PR6 — Conta Vinculada: retenção mensal</h2>
      <div class="ident">
        <div><span>Contrato</span><b id="i-contrato">—</b></div>
        <div><span>Empresa</span><b id="i-empresa">—</b></div>
      </div>
    </div>

    <div class="tituloform">CONTA VINCULADA MENSAL<span id="tf-periodo"></span></div>

    <div class="resumo">
      <div class="total-dest"><span>Total do mês para depósito</span><b id="t-r">R$ 0,00</b></div>
    </div>

    <div class="aviso" id="aviso" style="display:none"></div>

    <div class="tabbar" id="tabbar"></div>

    <div class="barra">
      <button class="btn btn-add" onclick="addLinha()">+ Adicionar funcionário</button>
      <button class="btn btn-copiar" id="btn-copiar-ant" onclick="copiarMesAnterior()" style="display:none">📋 Copiar do mês anterior</button>
      <button class="btn btn-excel" id="btn-excel" onclick="baixarExcelContaVinculada()" title="Baixar planilha de conta vinculada mensal em branco" style="display:none">📊 EXCEL</button>
      <input type="file" id="imp-file" accept=".xlsx,.xls,.csv" style="display:none" onchange="importarPlanilha(this)">
      <button class="btn btn-import" id="btn-import" onclick="document.getElementById('imp-file').click()" title="Importar funcionários de uma planilha Excel para o mês atual" style="display:none">📥 IMPORTAR</button>
      <button class="btn btn-salvar" onclick="salvar(true)">Salvar</button>
      <button class="btn btn-print" onclick="baixarPDF()">📄 Baixar PDF (mês atual)</button>
      <span class="status" id="status"></span>
    </div>

    <div id="tabela"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
'use strict';

// Página pública: a empresa abre pelo link e declara, mês a mês, a folha que
// gera a retenção da conta vinculada. Grava sem login em um único ramo do
// banco — retencao_empresa/<token> —, com o token vindo da URL. Nada mais do
// sistema é alcançável a partir daqui.

var firebaseConfig = {
  apiKey: "AIzaSyCTgZv2JVWs5yNw4T_WjxElGwrGApMk_sQ",
  authDomain: "fiscalizacao-d9a39.firebaseapp.com",
  databaseURL: "https://fiscalizacao-d9a39-default-rtdb.firebaseio.com",
  projectId: "fiscalizacao-d9a39",
  messagingSenderId: "287091891377",
  appId: "1:287091891377:web:dc9e307af79504bebd5690"
};

// Percentuais da IN 05, Anexo XII — os mesmos da planilha modelo
var PERC = {n: 0.0833, o: 0.121, p: 0.04};
var PERC_SUB_PADRAO = 0.0739;
var MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var SITUACOES = ['Admitido','Ativa','Demitido','Férias'];

var COLS = [
  {k:'cpf',              label:'CPF',                          tipo:'cpf',   w:'140px'},
  {k:'nome',             label:'Nome do funcionário',          tipo:'texto', w:'190px'},
  {k:'unidade',          label:'Unidade',                      tipo:'texto', w:'110px'},
  {k:'funcao',           label:'Função',                       tipo:'texto', w:'140px'},
  {k:'contratado',       label:'Contratado pela empresa',      tipo:'data',  w:'116px'},
  {k:'disponibilizacao', label:'Data de disponibilização',     tipo:'data',  w:'116px'},
  {k:'desligamento',     label:'Desligamento',                 tipo:'data',  w:'116px'},
  {k:'situacao',         label:'Situação',                     tipo:'select', opts:SITUACOES, w:'100px'},
  {k:'dias',             label:'Proporcionalidade (dias)',     tipo:'dias',  w:'74px'},
  {k:'remuneracao',      label:'Remuneração',                  tipo:'dinheiro', w:'110px'}
];
var CALC = [
  {k:'n', label:'13º salário'},
  {k:'o', label:'Férias e adicional'},
  {k:'p', label:'Rescisão e adicional do FGTS'},
  {k:'q', label:'Incidência sobre o submódulo 4.1'},
  {k:'r', label:'Total depositado'}
];

var TOKEN = '';
var DADOS = null;          // {contrato, empresa, unidade, perc, meses:[{mes,ano}], linhas:[]}
var MES_ATUAL = 0;
var fbdb = null, _timer = null, _bloqueado = false;

// ── Utilidades ──
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function num(v) {
  if (v === '' || v === null || v === undefined) return null;
  if (typeof v === 'number') return v;
  var t = String(v).replace(/R\$/gi,'').replace(/\s/g,'');
  if (t.indexOf(',') !== -1) t = t.replace(/\./g,'').replace(',','.');
  var n = parseFloat(t);
  return isNaN(n) ? null : n;
}
function moeda(v) {
  if (v === '' || v === null || v === undefined || isNaN(v)) return '';
  return 'R$ ' + Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function pctTexto(p) {
  return (p * 100).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) + '%';
}
function cpfMask(v) {
  var d = String(v||'').replace(/\D/g,'').slice(0,11);
  if (d.length <= 3) return d;
  if (d.length <= 6) return d.slice(0,3)+'.'+d.slice(3);
  if (d.length <= 9) return d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6);
  return d.slice(0,3)+'.'+d.slice(3,6)+'.'+d.slice(6,9)+'-'+d.slice(9);
}
function percSub() {
  return (DADOS && typeof DADOS.perc === 'number') ? DADOS.perc : PERC_SUB_PADRAO;
}

// Fórmulas da planilha modelo (aba Registro, colunas N a R), só o lado da
// retenção: base = remuneração × dias/30.
function calc(l) {
  var m = num(l.remuneracao), dias = num(l.dias);
  var base = (m || 0) * ((dias === null ? 0 : dias) / 30);
  var o = {n: base * PERC.n, o: base * PERC.o, p: base * PERC.p, q: base * percSub()};
  o.r = o.n + o.o + o.p + o.q;
  return o;
}

// Cada lançamento leva um id próprio: é por ele que a totalizadora reconhece
// a linha mesmo depois de a empresa reordenar ou apagar outras.
function novoId() {
  return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function mesRotulo(m) { return m ? (m.mes + '/' + m.ano) : ''; }
function linhasDoMes(i) {
  var m = DADOS.meses[i];
  if (!m) return [];
  return DADOS.linhas.filter(function(l) { return l.mes === m.mes && String(l.ano) === String(m.ano); });
}

// ── Tela ──
function renderTabs() {
  var bar = document.getElementById('tabbar');
  bar.innerHTML = DADOS.meses.map(function(m, i) {
    var qtd = linhasDoMes(i).length;
    return '<button class="tab-btn' + (i === MES_ATUAL ? ' active' : '') + '" onclick="trocarMes(' + i + ')">'
      + '<b>' + esc(m.mes) + '</b><small>' + esc(m.ano) + ' &middot; ' + qtd + '</small></button>';
  }).join('');
  if (!DADOS.meses.length) bar.innerHTML = '<span style="color:#fff;font-size:11px;padding:4px">Nenhum mês liberado pela PR6 ainda.</span>';
}

function renderTabela() {
  var alvo = document.getElementById('tabela');
  var m = DADOS.meses[MES_ATUAL];
  // O título mostra o período selecionado (o mesmo que sai no PDF/impressão).
  var tfp = document.getElementById('tf-periodo');
  if (tfp) tfp.textContent = m ? ' — ' + mesRotulo(m) : '';
  // "Copiar do mês anterior" só faz sentido a partir do 2º mês e com o formulário aberto
  var btnCopiar = document.getElementById('btn-copiar-ant');
  if (btnCopiar) btnCopiar.style.display = (m && MES_ATUAL > 0 && !_bloqueado) ? '' : 'none';
  // "EXCEL" (planilha de conta vinculada mensal em branco) só aparece no primeiro mês
  var btnExcel = document.getElementById('btn-excel');
  if (btnExcel) btnExcel.style.display = (m && MES_ATUAL === 0) ? '' : 'none';
  // "IMPORTAR" fica disponível em qualquer mês, desde que o formulário esteja aberto
  var btnImport = document.getElementById('btn-import');
  if (btnImport) btnImport.style.display = (m && !_bloqueado) ? '' : 'none';
  if (!m) { alvo.innerHTML = '<div class="vazio">Nenhum mês disponível.</div>'; return; }
  var linhas = linhasDoMes(MES_ATUAL);
  var ths = COLS.map(function(c) {
    return '<th class="cvcol-' + c.k + '" style="width:' + c.w + '">' + esc(c.label) + '</th>';
  }).join('') + CALC.map(function(c) {
    return '<th class="g1 cvc-' + c.k + '">' + esc(c.label) + '</th>';
  }).join('') + '<th class="cvc-x" style="width:34px"></th>';

  if (!linhas.length) {
    alvo.innerHTML = '<table><thead><tr>' + ths + '</tr></thead><tbody><tr><td colspan="'
      + (COLS.length + CALC.length + 1) + '" class="vazio">Nenhum funcionário lançado em '
      + esc(mesRotulo(m)) + '. Use "+ Adicionar funcionário".</td></tr></tbody></table>';
    atualizaTotais();
    return;
  }

  var tot = {n:0, o:0, p:0, q:0, r:0};
  var corpo = linhas.map(function(l) {
    var idx = DADOS.linhas.indexOf(l);
    var c = calc(l);
    tot.n += c.n; tot.o += c.o; tot.p += c.p; tot.q += c.q; tot.r += c.r;
    var tds = COLS.map(function(col) { return '<td class="cvcol-' + col.k + '">' + campoHtml(col, l, idx) + '</td>'; }).join('');
    var tdc = CALC.map(function(col) { return '<td class="calc cvc-' + col.k + '">' + esc(moeda(c[col.k])) + '</td>'; }).join('');
    return '<tr>' + tds + tdc
      + '<td class="cvc-x"><button class="rm" title="Remover" onclick="removerLinha(' + idx + ')">&times;</button></td></tr>';
  }).join('');

  alvo.innerHTML = '<table><thead><tr>' + ths + '</tr></thead><tbody>' + corpo + '</tbody>'
    + '<tfoot><tr><td colspan="' + COLS.length + '">Total de ' + esc(mesRotulo(m))
    + ' &middot; ' + linhas.length + ' funcionário(s)</td>'
    + CALC.map(function(col) { return '<td class="cvc-' + col.k + '">' + esc(moeda(tot[col.k])) + '</td>'; }).join('')
    + '<td class="cvc-x"></td></tr></tfoot></table>';
  atualizaTotais();
}

function campoHtml(col, l, idx) {
  var v = l[col.k] === undefined || l[col.k] === null ? '' : l[col.k];
  var dis = _bloqueado ? ' disabled' : '';
  var ev = ' oninput="setCampo(' + idx + ',\'' + col.k + '\',this.value,this)"';
  if (col.tipo === 'select') {
    return '<select' + dis + ' onchange="setCampo(' + idx + ',\'' + col.k + '\',this.value)"><option value=""></option>'
      + col.opts.map(function(o) {
          return '<option value="' + esc(o) + '"' + (String(v) === o ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select>';
  }
  if (col.tipo === 'data') return '<input type="date" value="' + esc(v) + '"' + dis + ev + '>';
  if (col.tipo === 'dias') return '<input type="number" min="0" max="30" step="1" value="' + esc(v) + '"' + dis + ev + '>';
  if (col.tipo === 'dinheiro') {
    var vd = (v !== '' && v !== null && num(v) !== null) ? moeda(num(v)) : v;
    return '<input value="' + esc(vd) + '" placeholder="R$ 0,00"' + dis + ev + '>';
  }
  if (col.tipo === 'cpf') return '<input value="' + esc(v) + '" placeholder="000.000.000-00"' + dis + ev + '>';
  if (col.k === 'nome') {
    var evNome = ' oninput="setCampo(' + idx + ',\'nome\',this.value,this);ajustaLargura(this)"';
    return '<input class="col-nome" style="width:' + larguraCh(v) + '" value="' + esc(v) + '"' + dis + evNome + '>';
  }
  return '<input value="' + esc(v) + '"' + dis + ev + '>';
}

// Largura do campo Nome proporcional ao texto (entre 16 e 44 caracteres).
function larguraCh(txt) {
  var n = String(txt == null ? '' : txt).length;
  return Math.min(44, Math.max(16, n + 3)) + 'ch';
}
function ajustaLargura(el) {
  if (el) el.style.width = larguraCh(el.value);
}

// Redesenha só o necessário: mexer na remuneração ou nos dias muda os
// calculados da linha, mas redesenhar a tabela inteira tiraria o foco.
function setCampo(idx, k, valor, el) {
  var l = DADOS.linhas[idx];
  if (!l) return;
  if (k === 'cpf' && el) { valor = cpfMask(valor); el.value = valor; }
  l[k] = valor;
  if (k === 'remuneracao' || k === 'dias') atualizaLinha(idx);
  atualizaTotais();
  salvar();
}

function atualizaLinha(idx) {
  var l = DADOS.linhas[idx];
  var tr = document.querySelectorAll('#tabela tbody tr')[linhasDoMes(MES_ATUAL).indexOf(l)];
  if (!tr) return;
  var c = calc(l);
  CALC.forEach(function(col, i) {
    var td = tr.querySelectorAll('td.calc')[i];
    if (td) td.textContent = moeda(c[col.k]);
  });
}

function atualizaTotais() {
  var tot = {n:0, o:0, p:0, q:0, r:0};
  linhasDoMes(MES_ATUAL).forEach(function(l) {
    var c = calc(l);
    tot.n += c.n; tot.o += c.o; tot.p += c.p; tot.q += c.q; tot.r += c.r;
  });
  CALC.forEach(function(col) {
    var el = document.getElementById('t-' + col.k);
    if (el) el.textContent = moeda(tot[col.k]) || 'R$ 0,00';
  });
  // o rodapé da tabela também acompanha
  var tf = document.querySelectorAll('#tabela tfoot td');
  if (tf.length) CALC.forEach(function(col, i) {
    if (tf[i + 1]) tf[i + 1].textContent = moeda(tot[col.k]);
  });
}

function trocarMes(i) {
  MES_ATUAL = i;
  renderTabs();
  renderTabela();
}

function addLinha() {
  var m = DADOS.meses[MES_ATUAL];
  if (!m) { alert('Nenhum mês disponível para lançamento.'); return; }
  DADOS.linhas.push({id: novoId(), tipo:'Retenção', mes:m.mes, ano:String(m.ano), cpf:'', nome:'',
                     unidade:'', funcao:'', contratado:'', disponibilizacao:'', desligamento:'',
                     situacao:'', dias:'30', remuneracao:''});
  renderTabs();
  renderTabela();
  salvar(true);      // linha nova grava na hora: fechar a aba logo depois não pode perdê-la
  var inp = document.querySelectorAll('#tabela tbody tr');
  if (inp.length) {
    var ultimo = inp[inp.length - 1].querySelector('input');
    if (ultimo) ultimo.focus();
  }
}

// Copia todos os funcionários do mês anterior para o mês atual, trazendo os
// campos de CPF até Remuneração (todas as colunas de preenchimento). Os
// valores calculados (verdes) são refeitos pelo próprio sistema.
function copiarMesAnterior() {
  if (_bloqueado || !DADOS) return;
  if (MES_ATUAL <= 0) { alert('Não há mês anterior para copiar.'); return; }
  var mAtual = DADOS.meses[MES_ATUAL], mAnt = DADOS.meses[MES_ATUAL - 1];
  if (!mAtual || !mAnt) return;
  var origem = linhasDoMes(MES_ATUAL - 1);
  if (!origem.length) {
    alert('O mês anterior (' + mesRotulo(mAnt) + ') não tem funcionários para copiar.');
    return;
  }
  var jaTem = linhasDoMes(MES_ATUAL).length;
  var msg = 'Copiar ' + origem.length + ' funcionário(s) de ' + mesRotulo(mAnt)
    + ' para ' + mesRotulo(mAtual) + '?';
  if (jaTem) msg += '\n\nAs ' + jaTem + ' linha(s) já lançadas neste mês serão mantidas; os copiados entram além delas.';
  if (!confirm(msg)) return;

  origem.forEach(function(l) {
    var nova = {id: novoId(), tipo: l.tipo || 'Retenção', mes: mAtual.mes, ano: String(mAtual.ano)};
    COLS.forEach(function(col) {
      nova[col.k] = (l[col.k] === undefined || l[col.k] === null) ? '' : l[col.k];
    });
    DADOS.linhas.push(nova);
  });
  renderTabs();
  renderTabela();
  salvar(true);
  status('✔ ' + origem.length + ' funcionário(s) copiado(s) de ' + mesRotulo(mAnt) + '.', 'ok');
}

function removerLinha(idx) {
  var l = DADOS.linhas[idx];
  if (!l) return;
  if (!confirm('Remover ' + (l.nome ? '"' + l.nome + '"' : 'esta linha') + '?')) return;
  DADOS.linhas.splice(idx, 1);
  renderTabs();
  renderTabela();
  salvar(true);
}

// ── Gravação ──
function status(txt, cls) {
  var el = document.getElementById('status');
  if (el) { el.textContent = txt; el.className = 'status' + (cls ? ' ' + cls : ''); }
}

function chaveLocal() { return 'cv_empresa_' + TOKEN; }

function salvar(imediato) {
  if (_bloqueado || !DADOS) return;
  try { localStorage.setItem(chaveLocal(), JSON.stringify(DADOS)); } catch (e) {}
  clearTimeout(_timer);
  function grava() {
    if (!fbdb) { status('Salvo só neste computador (sem conexão com o servidor)', 'erro'); return; }
    status('salvando…');
    // grava só o que é da empresa: os meses são definidos pela PR6
    fbdb.ref('retencao_empresa/' + TOKEN).update({
      linhas: DADOS.linhas,
      atualizadoEm: new Date().toISOString()
    }).then(function() {
      status('✔ salvo ' + new Date().toLocaleTimeString('pt-BR'), 'ok');
    }).catch(function(e) {
      console.error(e);
      status('❌ não foi possível salvar: ' + e.message, 'erro');
    });
  }
  if (imediato) grava(); else _timer = setTimeout(grava, 800);
}

function erroFatal(msg) {
  document.getElementById('carregando').innerHTML =
    '<div style="color:#d9534f;font-weight:bold;margin-bottom:8px">Não foi possível abrir o formulário</div>'
    + '<div style="color:#555;font-size:12px">' + esc(msg) + '</div>';
}

function iniciar() {
  var m = location.search.match(/[?&]f=([A-Za-z0-9_-]+)/);
  if (!m) { erroFatal('Link incompleto. Peça à PR6 o endereço completo do formulário.'); return; }
  TOKEN = m[1];

  try {
    firebase.initializeApp(firebaseConfig);
    fbdb = firebase.database();
  } catch (e) { fbdb = null; }

  var local = null;
  try { local = JSON.parse(localStorage.getItem(chaveLocal()) || 'null'); } catch (e) {}

  if (!fbdb) {
    if (!local) { erroFatal('Sem conexão com o servidor e sem cópia local deste formulário.'); return; }
    DADOS = local;
    montar();
    status('Sem conexão: mostrando a última cópia salva neste computador', 'erro');
    return;
  }

  fbdb.ref('retencao_empresa/' + TOKEN).once('value').then(function(snap) {
    var val = snap.val();
    if (!val) {
      erroFatal('Este formulário não existe ou foi removido. Confira o link com a PR6.');
      return;
    }
    DADOS = {
      contrato: val.contrato || '',
      empresa:  val.empresa || '',
      unidade:  val.unidade || '',
      perc:     (typeof val.perc === 'number') ? val.perc : PERC_SUB_PADRAO,
      meses:    Array.isArray(val.meses) ? val.meses : (val.meses ? Object.values(val.meses) : []),
      linhas:   Array.isArray(val.linhas) ? val.linhas : (val.linhas ? Object.values(val.linhas) : [])
    };
    _bloqueado = !!val.fechado;
    var faltando = DADOS.linhas.filter(function(l) { return !l.id; });
    faltando.forEach(function(l) { l.id = novoId(); });
    montar();
    if (faltando.length && !_bloqueado) salvar(true);   // grava os ids que faltavam
  }).catch(function(e) {
    if (local) {
      DADOS = local;
      montar();
      status('Sem acesso ao servidor: mostrando a cópia deste computador (' + e.message + ')', 'erro');
    } else {
      erroFatal('Sem acesso ao servidor: ' + e.message);
    }
  });
}

function montar() {
  document.getElementById('carregando').style.display = 'none';
  document.getElementById('conteudo').style.display = '';
  document.getElementById('i-contrato').textContent = DADOS.contrato || '—';
  document.getElementById('i-empresa').textContent = DADOS.empresa || '—';
  document.title = 'Conta Vinculada — ' + (DADOS.contrato || '') + (DADOS.empresa ? ' · ' + DADOS.empresa : '');
  if (_bloqueado) {
    var av = document.getElementById('aviso');
    av.style.display = '';
    av.innerHTML =
      '<b>Este formulário está fechado para edição.</b> Os dados abaixo são apenas para consulta. '
      + 'Se precisar corrigir algo, fale com a PR6.';
    document.querySelectorAll('.btn-add,.btn-salvar').forEach(function(b) { b.style.display = 'none'; });
  }
  renderTabs();
  renderTabela();
}

// ── Planilha de conta vinculada mensal em branco (botão "EXCEL", 1º mês) ──
// Gera um arquivo Excel (SpreadsheetML 2003, sem bibliotecas externas) com as
// mesmas colunas do formulário (CPF … Remuneração) e várias linhas vazias
// para a empresa preencher fora do sistema. O cabeçalho traz contrato,
// empresa e o mês/ano do primeiro período.
function baixarExcelContaVinculada() {
  if (!DADOS) return;
  var m0 = (DADOS.meses && DADOS.meses[0]) || null;
  var contrato = DADOS.contrato || '';
  var empresa  = DADOS.empresa || '';
  var periodo  = m0 ? mesRotulo(m0) : '';
  var ncols = COLS.length;

  var rows = [];
  function row(cellsXml) { rows.push('<Row>' + cellsXml + '</Row>'); }
  function cellTxt(txt, style, mergeAcross) {
    return '<Cell' + (style ? ' ss:StyleID="' + style + '"' : '')
      + (mergeAcross ? ' ss:MergeAcross="' + mergeAcross + '"' : '')
      + '><Data ss:Type="String">' + esc(txt) + '</Data></Cell>';
  }
  function cellEmpty(style) {
    return '<Cell' + (style ? ' ss:StyleID="' + style + '"' : '') + '/>';
  }
  // Estilo de célula vazia por tipo de coluna (para o formato acompanhar quando preenchida)
  function estiloCol(col) {
    if (col.tipo === 'dinheiro') return 'cMoney';
    if (col.tipo === 'dias')     return 'cInt';
    return 'cCell';
  }

  row(cellTxt('CONTA VINCULADA MENSAL', 'title', ncols - 1));
  row(cellTxt('Contrato: ' + contrato + '   |   Empresa: ' + empresa
      + (periodo ? '   |   Competência: ' + periodo : ''), 'sub', ncols - 1));
  row('');
  // Cabeçalho da tabela = rótulos das colunas do formulário
  row(COLS.map(function(c) { return cellTxt(c.label, 'hdr'); }).join(''));
  // Linhas em branco para preenchimento
  for (var i = 0; i < 30; i++) {
    row(COLS.map(function(c) { return cellEmpty(estiloCol(c)); }).join(''));
  }

  // Larguras das colunas (px do formulário → pontos do Excel)
  var colsXml = COLS.map(function(c) {
    var px = parseInt(c.w, 10) || 90;
    return '<Column ss:Width="' + Math.round(px * 0.78) + '"/>';
  }).join('');

  var xml =
    '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<?mso-application progid="Excel.Sheet"?>\n'
    + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"'
    + ' xmlns:o="urn:schemas-microsoft-com:office:office"'
    + ' xmlns:x="urn:schemas-microsoft-com:office:excel"'
    + ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
    + '<Styles>'
    + '<Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Center"/><Font ss:FontName="Arial" ss:Size="10"/></Style>'
    + '<Style ss:ID="title"><Font ss:Bold="1" ss:Size="14" ss:Color="#047857"/><Alignment ss:Horizontal="Center"/></Style>'
    + '<Style ss:ID="sub"><Font ss:Bold="1" ss:Size="10" ss:Color="#555555"/><Alignment ss:Horizontal="Center"/></Style>'
    + '<Style ss:ID="hdr"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#047857" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
    + '<Style ss:ID="cCell"><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#c9c9c9"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#c9c9c9"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#c9c9c9"/></Borders></Style>'
    + '<Style ss:ID="cInt"><NumberFormat ss:Format="0"/><Alignment ss:Horizontal="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#c9c9c9"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#c9c9c9"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#c9c9c9"/></Borders></Style>'
    + '<Style ss:ID="cMoney"><NumberFormat ss:Format="&quot;R$&quot;\\ #,##0.00"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#c9c9c9"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#c9c9c9"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#c9c9c9"/></Borders></Style>'
    + '</Styles>'
    + '<Worksheet ss:Name="Conta Vinculada"><Table>'
    + colsXml
    + rows.join('')
    + '</Table>'
    + '<WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><PageSetup><Layout x:Orientation="Landscape"/></PageSetup><FitToPage/><Print><FitWidth>1</FitWidth><FitHeight>0</FitHeight></Print></WorksheetOptions>'
    + '</Worksheet></Workbook>';

  var slug = (contrato || 'contrato').replace(/[\/\\]/g, '-').replace(/\s+/g, '');
  var perSlug = periodo ? '_' + periodo.replace(/\//g, '-') : '';
  var blob = new Blob(['﻿' + xml], {type: 'application/vnd.ms-excel'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'conta_vinculada_mensal_' + slug + perSlug + '.xls';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
  status('✔ Planilha de conta vinculada mensal baixada.', 'ok');
}

// ── Importar planilha Excel para o formulário (botão "IMPORTAR") ──
// Lê um arquivo .xlsx/.xls/.csv (inclusive a planilha em branco gerada pelo
// botão EXCEL, já preenchida) e insere os funcionários no mês selecionado.
// As colunas são reconhecidas pelo título do cabeçalho, em qualquer ordem.
var IMP_MATCH = {
  cpf:             ['cpf'],
  nome:            ['nome'],
  unidade:         ['unidade'],
  funcao:          ['funca', 'funço', 'funç'],
  contratado:      ['contratado'],
  disponibilizacao:['disponibiliza'],
  desligamento:    ['desligamento', 'desligado'],
  situacao:        ['situa'],
  dias:            ['proporcional', 'dias'],
  remuneracao:     ['remunera']
};

function impNorm(s) {
  return String(s == null ? '' : s).trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function impPad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
function impIsoLocal(dt) { return dt.getFullYear() + '-' + impPad2(dt.getMonth() + 1) + '-' + impPad2(dt.getDate()); }

// Converte o valor de uma célula para o formato que o formulário guarda.
function impValor(col, v) {
  if (v === undefined || v === null || v === '') return '';
  if (col.tipo === 'data') {
    if (v instanceof Date && !isNaN(v.getTime())) return impIsoLocal(v);
    var s = String(v).trim();
    var m1 = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m1) { var y = m1[3].length === 2 ? '20' + m1[3] : m1[3]; return y + '-' + impPad2(m1[2]) + '-' + impPad2(m1[1]); }
    var m2 = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m2) return m2[1] + '-' + impPad2(m2[2]) + '-' + impPad2(m2[3]);
    return s;
  }
  if (col.tipo === 'dias') {
    var n = parseInt(v, 10);
    return isNaN(n) ? '' : String(Math.max(0, Math.min(30, n)));
  }
  if (col.tipo === 'dinheiro') {
    if (typeof v === 'number') return String(v);
    return String(v).trim();
  }
  if (col.k === 'cpf') {
    var raw = (typeof v === 'number') ? String(Math.round(v)) : String(v).trim();
    var d = raw.replace(/\D/g, '');
    if (d && d.length < 11 && /^\d+$/.test(raw.replace(/\s/g, ''))) d = ('00000000000' + d).slice(-11);
    return d ? cpfMask(d) : raw;
  }
  if (col.k === 'situacao') {
    var sv = String(v).trim();
    if (!sv) return '';
    var hit = SITUACOES.filter(function(o) { return impNorm(o) === impNorm(sv); })[0];
    return hit || sv;
  }
  return String(v).trim();
}

// Localiza a linha de cabeçalho e mapeia cada coluna do formulário para o
// índice da coluna na planilha; devolve os lançamentos prontos para o mês m.
function impMapearLinhas(aoa, m) {
  var hdrIdx = -1, colMap = null, best = 0;
  for (var r = 0; r < aoa.length; r++) {
    var linha = aoa[r] || [];
    var map = {}, usados = {}, cnt = 0;
    for (var c = 0; c < linha.length; c++) {
      var h = impNorm(linha[c]);
      if (!h) continue;
      for (var k in IMP_MATCH) {
        if (map[k] !== undefined || usados[c]) continue;
        if (IMP_MATCH[k].some(function(kw) { return h.indexOf(kw) !== -1; })) {
          map[k] = c; usados[c] = 1; cnt++; break;
        }
      }
    }
    if (cnt > best) { best = cnt; hdrIdx = r; colMap = map; }
  }
  if (hdrIdx < 0 || best < 2) return [];

  var linhas = [];
  for (var r2 = hdrIdx + 1; r2 < aoa.length; r2++) {
    var row = aoa[r2] || [];
    var l = { id: novoId(), tipo: 'Retenção', mes: m.mes, ano: String(m.ano) };
    var algum = false;
    COLS.forEach(function(col) {
      var idx = colMap[col.k];
      var val = impValor(col, idx === undefined ? '' : row[idx]);
      l[col.k] = val;
      if (val !== '' && col.k !== 'dias') algum = true;
    });
    if (l.dias === '') l.dias = '30';
    if (algum) linhas.push(l);
  }
  return linhas;
}

function importarPlanilha(input) {
  var file = input && input.files && input.files[0];
  if (input) input.value = '';   // permite reimportar o mesmo arquivo
  if (!file) return;
  if (typeof XLSX === 'undefined') { alert('A biblioteca de leitura de Excel ainda não carregou. Verifique a conexão e tente de novo.'); return; }
  if (_bloqueado) { alert('Este formulário está fechado para edição.'); return; }
  var m = DADOS.meses[MES_ATUAL];
  if (!m) { alert('Selecione um mês para importar.'); return; }

  status('lendo planilha…');
  var reader = new FileReader();
  reader.onerror = function() { status('❌ não foi possível ler o arquivo', 'erro'); };
  reader.onload = function(e) {
    try {
      var wb = XLSX.read(new Uint8Array(e.target.result), {type: 'array', cellDates: true});
      var ws = wb.Sheets[wb.SheetNames[0]];
      if (!ws) { alert('A planilha está vazia.'); status(''); return; }
      var aoa = XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: ''});
      var novas = impMapearLinhas(aoa, m);
      if (!novas.length) {
        alert('Nenhum funcionário encontrado na planilha.\n\nConfira se a primeira linha de dados tem os títulos das colunas (CPF, Nome do funcionário, Unidade, …).');
        status('');
        return;
      }
      var msg = 'Importar ' + novas.length + ' funcionário(s) para ' + mesRotulo(m) + '?';
      var jaTem = linhasDoMes(MES_ATUAL).length;
      if (jaTem) msg += '\n\nAs ' + jaTem + ' linha(s) já lançadas neste mês serão mantidas; os importados entram além delas.';
      if (!confirm(msg)) { status(''); return; }
      novas.forEach(function(l) { DADOS.linhas.push(l); });
      renderTabs();
      renderTabela();
      salvar(true);
      status('✔ ' + novas.length + ' funcionário(s) importado(s) para ' + mesRotulo(m) + '.', 'ok');
    } catch (err) {
      console.error(err);
      alert('Não foi possível importar a planilha: ' + err.message);
      status('❌ falha na importação', 'erro');
    }
  };
  reader.readAsArrayBuffer(file);
}

// ── Baixar PDF direto (botão "Baixar PDF") ──
// Gera o PDF do mês selecionado sem abrir a janela de impressão. Reproduz o
// mesmo recorte da impressão: colunas de preenchimento (menos "Contratado
// pela empresa") + "Total depositado", em A4 paisagem, com o período no título.
function baixarPDF() {
  if (!DADOS) return;
  var m = DADOS.meses[MES_ATUAL];
  if (!m) { alert('Nenhum mês disponível para gerar o PDF.'); return; }
  var jspdfNS = window.jspdf || (typeof jspdf !== 'undefined' ? jspdf : null);
  if (!jspdfNS || !jspdfNS.jsPDF) {
    alert('A biblioteca de PDF ainda não carregou. Verifique a conexão e tente de novo.');
    return;
  }
  var doc = new jspdfNS.jsPDF({orientation: 'landscape', unit: 'pt', format: 'a4'});
  if (typeof doc.autoTable !== 'function') {
    alert('O componente de tabela do PDF não carregou. Verifique a conexão e tente de novo.');
    return;
  }
  var W = doc.internal.pageSize.getWidth();
  var periodo = mesRotulo(m);
  var linhas = linhasDoMes(MES_ATUAL);

  // Monta o corpo antes do cabeçalho para já ter o total do mês (card).
  var head = [['CPF', 'Nome do funcionário', 'Unidade', 'Função', 'Data de disponibilização',
               'Desligamento', 'Situação', 'Prop. (dias)', 'Remuneração', 'Total depositado']];
  var totR = 0;
  var body = linhas.map(function(l) {
    var c = calc(l); totR += c.r;
    return [l.cpf || '', l.nome || '', l.unidade || '', l.funcao || '',
            l.disponibilizacao || '', l.desligamento || '', l.situacao || '',
            (l.dias === '' || l.dias == null ? '' : String(l.dias)),
            moeda(num(l.remuneracao)), moeda(c.r)];
  });
  var foot = [[{content: 'Total de ' + periodo + ' · ' + linhas.length + ' funcionário(s)',
               colSpan: 9, styles: {halign: 'right'}}, moeda(totR)]];

  // Cabeçalho
  doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(4, 120, 87);
  doc.text('UNIVERSIDADE FEDERAL DO RIO DE JANEIRO', W / 2, 26, {align: 'center'});
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(85, 85, 85);
  doc.text('Pró-Reitoria de Gestão e Governança · PR6 — Conta Vinculada: retenção mensal', W / 2, 38, {align: 'center'});
  doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(4, 120, 87);
  doc.text('CONTA VINCULADA MENSAL — ' + periodo, W / 2, 56, {align: 'center'});

  // Card "TOTAL DO MÊS PARA DEPÓSITO" logo abaixo do título (igual ao da tela)
  var cardW = 260, cardH = 38, cardX = (W - cardW) / 2, cardY = 64;
  doc.setDrawColor(167, 243, 208); doc.setFillColor(236, 253, 244); doc.setLineWidth(0.8);
  doc.roundedRect(cardX, cardY, cardW, cardH, 4, 4, 'FD');
  doc.setFont('helvetica', 'bold'); doc.setFontSize(7); doc.setTextColor(4, 120, 87);
  doc.text('TOTAL DO MÊS PARA DEPÓSITO', W / 2, cardY + 13, {align: 'center'});
  doc.setFontSize(16);
  doc.text(moeda(totR), W / 2, cardY + 30, {align: 'center'});

  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(0, 0, 0);
  doc.text('Contrato: ' + (DADOS.contrato || '—') + '     Empresa: ' + (DADOS.empresa || '—'), 20, 120);

  doc.autoTable({
    head: head, body: body, foot: foot, startY: 128,
    styles: {fontSize: 7, cellPadding: 2, overflow: 'linebreak', lineColor: [201, 201, 201], lineWidth: 0.5},
    headStyles: {fillColor: [4, 120, 87], textColor: 255, fontStyle: 'bold', halign: 'center'},
    footStyles: {fillColor: [4, 120, 87], textColor: 255, fontStyle: 'bold'},
    alternateRowStyles: {fillColor: [240, 253, 244]},
    columnStyles: {
      0: {halign: 'center'}, 1: {halign: 'left'}, 4: {halign: 'center'}, 5: {halign: 'center'},
      6: {halign: 'center'}, 7: {halign: 'center'}, 8: {halign: 'right'},
      9: {halign: 'right', fontStyle: 'bold', textColor: [4, 120, 87]}
    },
    margin: {left: 20, right: 20}
  });

  var slug = (DADOS.contrato || 'contrato').replace(/[\/\\]/g, '-').replace(/\s+/g, '');
  doc.save('conta_vinculada_' + slug + '_' + periodo.replace(/\//g, '-') + '.pdf');
  status('✔ PDF de ' + periodo + ' baixado.', 'ok');
}

document.addEventListener('DOMContentLoaded', iniciar);
</script>
